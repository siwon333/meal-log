<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>하루 식단표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 학교 식단표 한 장. 월 제목과 확인란 3칸, 오늘 입력줄, 주 단위 표(월~일 x 아침/점심/저녁/간식).
   좁은 화면에서는 하루가 한 줄 카드가 된다. */
:root {
  --bg: #eceee9;
  --sheet: #ffffff;
  --faint: #f4f5f1;
  --ink: #161616;
  --line: #161616;
  --hair: #cfd2ca;
  --mute: #666962;
  --sun: #cf2530;
  --sat: #2459c9;
  --mark: #ffe36e;
  --on-mark: #161616;
  --on-ink: #ffffff;
  --focus: #2459c9;
  --wk1: #e8b9b5;
  --wk2: #f3cda9;
  --wk3: #d4e2b4;
  --wk4: #bcd9e8;
  --wk5: #d3c6e6;
  --wk6: #ead8a9;
  --font-display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111210;
    --sheet: #1a1b19;
    --faint: #232421;
    --ink: #ecece6;
    --line: #9a9c94;
    --hair: #3a3c37;
    --mute: #a2a59d;
    --sun: #ff7a81;
    --sat: #86abff;
    --mark: #5a4d12;
    --on-mark: #fff2bd;
    --on-ink: #121212;
    --focus: #8db0ff;
    --wk1: #5b3a38;
    --wk2: #5c4631;
    --wk3: #46532f;
    --wk4: #2f4c59;
    --wk5: #4a4160;
    --wk6: #5a4f2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111210;
  --sheet: #1a1b19;
  --faint: #232421;
  --ink: #ecece6;
  --line: #9a9c94;
  --hair: #3a3c37;
  --mute: #a2a59d;
  --sun: #ff7a81;
  --sat: #86abff;
  --mark: #5a4d12;
  --on-mark: #fff2bd;
  --on-ink: #121212;
  --focus: #8db0ff;
  --wk1: #5b3a38;
  --wk2: #5c4631;
  --wk3: #46532f;
  --wk4: #2f4c59;
  --wk5: #4a4160;
  --wk6: #5a4f2e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-block: 20px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; }

/* ---- header ---- */
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font: 600 11px/1 var(--font-mono); letter-spacing: .14em; color: var(--mute); margin: 0 0 8px; }
.title { display: flex; align-items: center; gap: 10px; }
h1 { font: 400 clamp(36px, 7vw, 56px)/1 var(--font-display); letter-spacing: .02em; margin: 0; }
.navbtn { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--sheet); font-size: 20px; line-height: 1; display: grid; place-items: center; padding: 0; }
.navbtn:hover { background: var(--faint); }
.todaybtn { height: 40px; padding: 0 12px; border: 1px solid var(--line); background: var(--sheet); font-weight: 700; font-size: 13px; }
.todaybtn:hover { background: var(--faint); }

.stamps { display: grid; grid-template-columns: repeat(3, minmax(84px, 1fr)); border: 2px solid var(--line); background: var(--sheet); min-width: min(100%, 300px); }
.stamps > div + div { border-left: 1px solid var(--line); }
.stamps .h { font-weight: 700; font-size: 12px; text-align: center; padding: 4px 6px; background: var(--faint); border-bottom: 1px solid var(--line); white-space: nowrap; }
.stamps .v { font: 600 22px/1 var(--font-mono); text-align: center; padding: 12px 6px; font-variant-numeric: tabular-nums; }
.stamps .v small { font: 400 12px var(--font-body); color: var(--mute); margin-left: 2px; }

/* ---- quick add ---- */
.quick { margin-top: 18px; border: 2px solid var(--line); background: var(--sheet); padding: 14px; display: grid; gap: 10px; }
.quick .lbl { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-weight: 700; }
.quick .lbl span { font: 400 13px var(--font-mono); color: var(--mute); }
.qrow { display: flex; flex-wrap: wrap; gap: 10px; }
.chips { display: flex; border: 1px solid var(--line); }
.chips label { position: relative; display: block; }
.chips label + label { border-left: 1px solid var(--line); }
.chips input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chips span { display: block; padding: 10px 14px; font-weight: 700; font-size: 14px; background: var(--sheet); }
.chips input:checked + span { background: var(--ink); color: var(--on-ink); }
.chips input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
#q { flex: 1 1 200px; min-width: 0; font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); background: var(--sheet); border-radius: 0; }
#q::placeholder { color: var(--mute); }
.addbtn { padding: 0 22px; min-height: 44px; border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); font: 700 14px var(--font-mono); letter-spacing: .12em; }
.addbtn[disabled], .btn[disabled] { opacity: .45; cursor: not-allowed; }
.status { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--mute); }
.status.err { color: var(--sun); }

.empty-note { margin: 14px 0 0; padding: 12px 14px; border: 1px dashed var(--line); background: var(--sheet); font-size: 14px; }

/* ---- board (mobile first: one card per day) ---- */
.board { margin-top: 16px; border: 2px solid var(--line); background: var(--sheet); }
.dow, .rl { display: none; }
.wlabel { display: flex; align-items: baseline; gap: 10px; padding: 7px 12px; background: var(--tint); border-top: 2px solid var(--line); border-bottom: 1px solid var(--line); }
.week:first-child .wlabel { border-top: 0; }
.wlabel b { font-weight: 700; }
.wlabel .rng { font: 400 12px var(--font-mono); }
.day { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr); border-bottom: 1px solid var(--hair); }
.day.out { display: none; }
.dc, .sc { appearance: none; border: 0; background: none; text-align: left; padding: 0; min-width: 0; }
.dc { grid-column: 1; grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--faint); border-right: 1px solid var(--hair); padding: 8px 4px; }
.dc .n { font: 600 20px/1 var(--font-mono); }
.dc .w { font-size: 12px; font-weight: 500; }
.sun .n, .sun .w { color: var(--sun); }
.sat .n, .sat .w { color: var(--sat); }
.today .dc { background: var(--mark); }
.today .dc .n, .today .dc .w { color: var(--on-mark); }
.sc { display: block; padding: 8px 10px; min-height: 52px; }
.sc.b { grid-column: 2; grid-row: 1; border-bottom: 1px dashed var(--hair); border-right: 1px dashed var(--hair); }
.sc.l { grid-column: 3; grid-row: 1; border-bottom: 1px dashed var(--hair); }
.sc.d { grid-column: 2; grid-row: 2; border-right: 1px dashed var(--hair); }
.sc.s { grid-column: 3; grid-row: 2; }
.sc:hover, .dc:hover { filter: brightness(.97); }
.sc:hover { background: var(--faint); }
.lb { display: block; font: 600 10px/1.2 var(--font-mono); letter-spacing: .08em; color: var(--mute); margin-bottom: 2px; }
.it { display: block; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.it.none { color: var(--hair); }
.foot { margin: 12px 0 0; text-align: right; font-size: 12px; color: var(--mute); }

/* ---- wide: the printed table ---- */
@media (min-width: 980px) {
  .dow { display: grid; grid-template-columns: 44px 52px repeat(7, minmax(0, 1fr)); background: var(--faint); border-bottom: 2px solid var(--line); font-weight: 700; }
  .dow div { padding: 7px 4px; text-align: center; }
  .dow div:first-child { grid-column: 1 / 3; }
  .dow div + div { border-left: 1px solid var(--line); }
  .dow .sun { color: var(--sun); }
  .dow .sat { color: var(--sat); }
  .week { display: grid; grid-template-columns: 44px 52px repeat(7, minmax(0, 1fr)); grid-template-rows: auto repeat(4, minmax(56px, auto)); border-top: 2px solid var(--line); }
  .week:first-of-type { border-top: 0; }
  .wlabel { grid-column: 1; grid-row: 1 / 6; border: 0; justify-content: center; align-items: center; padding: 4px; }
  .wlabel .rng { display: none; }
  .rl { display: flex; align-items: center; justify-content: center; grid-column: 2; font-weight: 700; font-size: 13px; background: var(--faint); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  .week .rl:first-of-type { border-top: 0; }
  .day, .day.out { display: contents; }
  .dc, .sc { grid-column: calc(var(--c) + 2); border-left: 1px solid var(--line); border-top: 1px solid var(--line); border-bottom: 0; border-right: 0; }
  .dc { grid-row: 1; border-top: 0; flex-direction: row; padding: 6px 4px; background: var(--sheet); }
  .dc .w { display: none; }
  .dc .n { font-size: 16px; }
  .sc.b { grid-row: 2; }
  .sc.l { grid-row: 3; }
  .sc.d { grid-row: 4; }
  .sc.s { grid-row: 5; }
  .sc { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6px 5px; }
  .lb, .it.none { display: none; }
  .it { font-size: 13px; }
  .sc.empty:hover::after { content: "+"; color: var(--mute); font: 400 18px var(--font-mono); }
  .day.out .dc, .day.out .sc { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--hair) 6px 7px); }
  .today .sc { background: var(--faint); }
  .today .sc:hover { background: var(--hair); }
}

/* ---- editor sheet ---- */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .5); padding: 0 max(0px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(0px, env(safe-area-inset-left, 0px)); }
.panel { width: min(560px, 100%); max-height: 94%; overflow: auto; background: var(--sheet); border: 2px solid var(--line); padding: 18px 16px 16px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font: 400 26px/1.1 var(--font-display); }
.panel .hint { margin: 0; font-size: 13px; color: var(--mute); }
.field { display: grid; gap: 4px; }
.field label { font-weight: 700; font-size: 13px; }
.field textarea { width: 100%; min-height: 3.4em; resize: vertical; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); background: var(--sheet); border-radius: 0; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.acts .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 42px; padding: 0 16px; border: 1px solid var(--line); background: var(--sheet); font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.danger { color: var(--sun); }
@media (min-width: 600px) { .sheet { align-items: center; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow">MEAL LOG</p>
      <div class="title">
        <button class="navbtn" id="prev" type="button" aria-label="이전 달">‹</button>
        <h1 id="mtitle">식단</h1>
        <button class="navbtn" id="next" type="button" aria-label="다음 달">›</button>
        <button class="todaybtn" id="gotoday" type="button">오늘</button>
      </div>
    </div>
    <div class="stamps" aria-label="이번 달 요약">
      <div><div class="h">기록한 날</div><div class="v" id="s-days">0</div></div>
      <div><div class="h">기록한 끼니</div><div class="v" id="s-meals">0</div></div>
      <div><div class="h">연속 기록</div><div class="v" id="s-streak">0<small>일</small></div></div>
    </div>
  </header>

  <form class="quick" id="quick" autocomplete="off">
    <div class="lbl">오늘 먹은 것 <span id="qdate"></span></div>
    <div class="qrow">
      <div class="chips" role="radiogroup" aria-label="끼니 선택" id="chips"></div>
      <input id="q" type="text" placeholder="예: 김치찌개, 공기밥" aria-label="먹은 음식" maxlength="120">
      <button class="addbtn" id="add" type="submit" disabled>ADD</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">불러오는 중…</p>
  </form>

  <p class="empty-note" id="emptynote" hidden></p>

  <main class="board" id="board" aria-label="월간 식단표"></main>
  <p class="foot" id="foot"></p>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <h2 id="sh-title"></h2>
    <p class="hint">한 줄에 하나씩 적어요. 쉼표로 나눠도 돼요.</p>
    <div id="fields"></div>
    <div class="acts">
      <button class="btn danger" id="sh-clear" type="button">이 날 지우기</button>
      <div class="grp">
        <button class="btn" id="sh-close" type="button">닫기</button>
        <button class="btn primary" id="sh-save" type="button" disabled>저장</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var SLOTS = [{k:'b', n:'아침'}, {k:'l', n:'점심'}, {k:'d', n:'저녁'}, {k:'s', n:'간식'}];
  var DOW = ['월','화','수','목','금','토','일'];
  var LS_KEY = 'meal-log-v1';

  var months = {};            // 'YYYY-MM' -> { 'YYYY-MM-DD': {b:[],l:[],d:[],s:[]} }
  var mode = 'loading';       // loading | cloud | local
  var ready = false;
  var col = null;
  var inflight = {};
  var chain = {};
  var view = null;
  var editing = null;
  var clearArmed = false;
  var slotSel = 'l';

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ds = function (y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); };
  var fmt = function (t) { return ds(t.getFullYear(), t.getMonth(), t.getDate()); };
  var todayStr = function () { return fmt(new Date()); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var parseItems = function (t) { return t.split(/[\n,，、]+/).map(function (s) { return s.trim().slice(0, 60); }).filter(Boolean).slice(0, 20); };
  var getDay = function (date) { var mo = months[date.slice(0, 7)]; return (mo && mo[date]) || null; };
  var cloneDay = function (e) { var o = {}; SLOTS.forEach(function (s) { o[s.k] = ((e && e[s.k]) || []).slice(); }); return o; };
  var filled = function (e) { return !!e && SLOTS.some(function (s) { return e[s.k] && e[s.k].length; }); };
  var dowIndex = function (d) { return (d.getDay() + 6) % 7; };

  // ---- default slot by hour ----
  (function () {
    var h = new Date().getHours();
    slotSel = h < 10 ? 'b' : h < 15 ? 'l' : h < 21 ? 'd' : 's';
  })();
  var now0 = new Date();
  view = { y: now0.getFullYear(), m: now0.getMonth() };

  // ---- persistence ----
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(months)); } catch (e) {} }

  function norm(d) {
    var days = {}, src = (d && d.days) || {};
    Object.keys(src).forEach(function (date) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      var e = src[date], o = {}, any = false;
      SLOTS.forEach(function (s) {
        var a = Array.isArray(e && e[s.k]) ? e[s.k].filter(function (x) { return typeof x === 'string' && x; }) : [];
        o[s.k] = a; if (a.length) any = true;
      });
      if (any) days[date] = o;
    });
    return days;
  }

  function writeMonth(mk, retry) {
    return col.doc('m-' + mk).set({ days: months[mk] || {} }).catch(function (e) {
      if (!retry && e && e.code === 'unavailable') {
        return new Promise(function (r) { setTimeout(r, 400 + Math.random() * 600); }).then(function () { return writeMonth(mk, true); });
      }
      throw e;
    });
  }
  function persist(mk) {
    if (mode !== 'cloud') { lsSave(); return; }
    inflight[mk] = (inflight[mk] || 0) + 1;
    chain[mk] = (chain[mk] || Promise.resolve()).then(function () { return writeMonth(mk, false); }).catch(function (e) {
      flash(e && e.code === 'quota_exceeded' ? '저장 공간이 가득 찼어요. 오래된 기록을 지운 뒤 다시 시도해 주세요.' : '저장하지 못했어요. 연결을 확인하고 다시 시도해 주세요.', true);
    }).then(function () { inflight[mk]--; });
  }

  function setDay(date, slots) {
    var mk = date.slice(0, 7);
    if (!months[mk]) months[mk] = {};
    if (filled(slots)) months[mk][date] = slots; else delete months[mk][date];
    persist(mk);
    render();
  }

  function setReady(v, note) {
    ready = v;
    $('add').disabled = !v;
    $('sh-save').disabled = !v;
    if (v) flash(note || '');
    setFoot();
  }
  function setFoot() {
    $('foot').textContent = '* 직접 적은 기록이에요. ' + (mode === 'cloud' ? '내 계정에 저장돼요.' : mode === 'local' ? '이 브라우저에만 저장돼요.' : '');
  }
  var flashTimer = null;
  function flash(msg, err) {
    var el = $('status');
    el.textContent = msg;
    el.className = 'status' + (err ? ' err' : '');
    clearTimeout(flashTimer);
    if (msg && !err) flashTimer = setTimeout(function () { if (el.textContent === msg) el.textContent = ''; }, 6000);
  }

  function initStore() {
    var use = window.claude && window.claude.use;
    var p = use ? Promise.all([use('db'), use('user')]) : Promise.resolve([null, null]);
    p.then(function (r) {
      var db = r[0], user = r[1];
      return Promise.resolve(user ? user.id() : null).then(function (uid) { return [db, uid]; });
    }).catch(function () { return [null, null]; }).then(function (r) {
      var db = r[0], uid = r[1];
      if (!db || !uid) {
        mode = 'local'; months = lsLoad(); setReady(true); render(); return;
      }
      mode = 'cloud';
      col = db.collection('data/users/' + uid);
      var timer = setTimeout(function () { setReady(true, '연결이 느려요. 기록이 최신이 아닐 수 있어요.'); }, 10000);
      col.onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) {
          if (d.id.indexOf('m-') === 0) next[d.id.slice(2)] = norm(d.data());
        });
        Object.keys(inflight).forEach(function (mk) { if (inflight[mk] > 0 && months[mk]) next[mk] = months[mk]; });
        months = next;
        if (!snap.metadata.fromCache && !ready) { clearTimeout(timer); setReady(true); }
        render();
      }, function () {
        clearTimeout(timer);
        mode = 'local';
        var saved = lsLoad();
        Object.keys(saved).forEach(function (k) { if (!months[k]) months[k] = saved[k]; });
        setReady(true, '저장소에 연결하지 못해서 이 브라우저에 임시로 저장해요.');
        render();
      });
    });
  }

  // ---- stats ----
  function streak() {
    var d = new Date(); d.setHours(12, 0, 0, 0);
    if (!filled(getDay(fmt(d)))) d.setDate(d.getDate() - 1);
    var n = 0;
    while (filled(getDay(fmt(d))) && n < 1000) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  // ---- render ----
  function weekHTML(w, lead, dim, y, m, tstr) {
    var lo = 99, hi = 0, c, dn, i;
    for (c = 0; c < 7; c++) { dn = w * 7 + c - lead + 1; if (dn >= 1 && dn <= dim) { lo = Math.min(lo, dn); hi = Math.max(hi, dn); } }
    var mm = pad(m + 1);
    var h = '<section class="week" style="--tint:var(--wk' + ((w % 6) + 1) + ')"><div class="wlabel"><b>' + (w + 1) + '주</b><span class="rng">' + mm + '.' + pad(lo) + ' – ' + mm + '.' + pad(hi) + '</span></div>';
    h += '<div class="rl" style="grid-row:1">날짜</div>';
    SLOTS.forEach(function (s, idx) { h += '<div class="rl" style="grid-row:' + (idx + 2) + '">' + s.n + '</div>'; });
    for (c = 0; c < 7; c++) {
      dn = w * 7 + c - lead + 1;
      if (dn < 1 || dn > dim) {
        h += '<div class="day out" style="--c:' + (c + 1) + '"><div class="dc"></div>';
        SLOTS.forEach(function (s) { h += '<div class="sc ' + s.k + '"></div>'; });
        h += '</div>';
        continue;
      }
      var date = ds(y, m, dn), e = getDay(date);
      var cls = 'day' + (date === tstr ? ' today' : '') + (c === 6 ? ' sun' : '') + (c === 5 ? ' sat' : '');
      h += '<div class="' + cls + '" style="--c:' + (c + 1) + '">';
      h += '<button type="button" class="dc" data-date="' + date + '" aria-label="' + (m + 1) + '월 ' + dn + '일 ' + DOW[c] + '요일 열기"><span class="n">' + dn + '</span><span class="w">' + DOW[c] + '</span></button>';
      for (i = 0; i < SLOTS.length; i++) {
        var s = SLOTS[i], items = (e && e[s.k]) || [];
        h += '<button type="button" class="sc ' + s.k + (items.length ? '' : ' empty') + '" data-date="' + date + '" data-slot="' + s.k + '" aria-label="' + dn + '일 ' + s.n + ' 기록"><span class="lb">' + s.n + '</span>';
        h += items.length ? items.map(function (t) { return '<span class="it">' + esc(t) + '</span>'; }).join('') : '<span class="it none">—</span>';
        h += '</button>';
      }
      h += '</div>';
    }
    return h + '</section>';
  }

  function render() {
    var y = view.y, m = view.m, tstr = todayStr();
    var first = new Date(y, m, 1), lead = dowIndex(first), dim = new Date(y, m + 1, 0).getDate();
    var weeks = Math.ceil((lead + dim) / 7);
    $('mtitle').textContent = (m + 1) + '월 식단';
    $('eyebrow').textContent = y + ' · 나의 식단 기록';

    var dowH = '<div class="dow"><div>요일</div>' + DOW.map(function (d, i) { return '<div class="' + (i === 6 ? 'sun' : i === 5 ? 'sat' : '') + '">' + d + '</div>'; }).join('') + '</div>';
    var html = dowH;
    for (var w = 0; w < weeks; w++) html += weekHTML(w, lead, dim, y, m, tstr);
    $('board').innerHTML = html;

    var mo = months[y + '-' + pad(m + 1)] || {}, days = 0, meals = 0;
    Object.keys(mo).forEach(function (date) {
      var e = mo[date]; if (!filled(e)) return;
      days++; SLOTS.forEach(function (s) { if (e[s.k] && e[s.k].length) meals++; });
    });
    $('s-days').textContent = days;
    $('s-meals').textContent = meals;
    $('s-streak').innerHTML = streak() + '<small>일</small>';

    var note = $('emptynote');
    if (days === 0) {
      note.hidden = false;
      note.textContent = (m + 1) + '월에는 아직 기록이 없어요. 위에서 오늘 먹은 걸 적으면 이 표에 날짜별로 쌓여요. 표의 칸을 눌러 다른 날도 적을 수 있어요.';
    } else note.hidden = true;

    var t = new Date();
    $('qdate').textContent = pad(t.getMonth() + 1) + '.' + pad(t.getDate()) + ' (' + DOW[dowIndex(t)] + ')';
  }

  // ---- quick add ----
  function buildChips() {
    $('chips').innerHTML = SLOTS.map(function (s) {
      return '<label><input type="radio" name="slot" value="' + s.k + '"' + (s.k === slotSel ? ' checked' : '') + '><span>' + s.n + '</span></label>';
    }).join('');
    $('chips').addEventListener('change', function (e) { if (e.target && e.target.name === 'slot') slotSel = e.target.value; });
  }

  $('quick').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!ready) return;
    var items = parseItems($('q').value);
    if (!items.length) { flash('먹은 음식을 적어 주세요.', true); return; }
    var date = todayStr(), day = cloneDay(getDay(date));
    day[slotSel] = day[slotSel].concat(items).slice(0, 30);
    var n = new Date(); view = { y: n.getFullYear(), m: n.getMonth() };
    setDay(date, day);
    var name = SLOTS.filter(function (s) { return s.k === slotSel; })[0].n;
    flash(name + '에 ' + items.join(', ') + ' 추가했어요.');
    $('q').value = '';
    $('q').focus();
  });

  // ---- month nav ----
  function shift(n) { var d = new Date(view.y, view.m + n, 1); view = { y: d.getFullYear(), m: d.getMonth() }; render(); }
  $('prev').addEventListener('click', function () { shift(-1); });
  $('next').addEventListener('click', function () { shift(1); });
  $('gotoday').addEventListener('click', function () { var n = new Date(); view = { y: n.getFullYear(), m: n.getMonth() }; render(); });

  // ---- editor ----
  function buildFields() {
    $('fields').innerHTML = SLOTS.map(function (s) {
      return '<div class="field"><label for="f-' + s.k + '">' + s.n + '</label><textarea id="f-' + s.k + '" rows="2" maxlength="400"></textarea></div>';
    }).join('');
  }
  function resetClear() { clearArmed = false; $('sh-clear').textContent = '이 날 지우기'; }
  function openEditor(date, key) {
    editing = date; resetClear();
    var p = date.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
    $('sh-title').textContent = p[1] + '월 ' + p[2] + '일 (' + DOW[dowIndex(d)] + ')';
    var e = getDay(date);
    SLOTS.forEach(function (s) { $('f-' + s.k).value = ((e && e[s.k]) || []).join('\n'); });
    $('sheet').hidden = false;
    $('f-' + (key || 'b')).focus();
  }
  function closeEditor() { $('sheet').hidden = true; editing = null; resetClear(); }

  $('board').addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-date]');
    if (t) openEditor(t.getAttribute('data-date'), t.getAttribute('data-slot'));
  });
  $('sh-close').addEventListener('click', closeEditor);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeEditor(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeEditor(); });
  $('sh-save').addEventListener('click', function () {
    if (!editing || !ready) return;
    var o = {};
    SLOTS.forEach(function (s) { o[s.k] = parseItems($('f-' + s.k).value); });
    setDay(editing, o);
    closeEditor();
  });
  $('sh-clear').addEventListener('click', function () {
    if (!editing || !ready) return;
    if (!clearArmed) { clearArmed = true; $('sh-clear').textContent = '정말 지울까요?'; return; }
    setDay(editing, cloneDay(null));
    closeEditor();
  });

  buildChips();
  buildFields();
  setFoot();
  render();
  initStore();
})();
</script>

</body>
</html>
